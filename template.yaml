AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: S3 (entrada/) -> Lambda -> S3 (resumo/) + DynamoDB. Tudo no nível gratuito da AWS.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 128

Resources:
  Bucket:
    Type: AWS::S3::Bucket

  Tabela:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: empresa, AttributeType: S }
        - { AttributeName: arquivo, AttributeType: S }
      KeySchema:
        - { AttributeName: empresa, KeyType: HASH }
        - { AttributeName: arquivo, KeyType: RANGE }

  Resumir:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: serverless_reclamacoes.handler.handler
      Environment:
        Variables:
          TABELA: !Ref Tabela
      Policies:
        - S3CrudPolicy: { BucketName: !Ref Bucket }
        - DynamoDBCrudPolicy: { TableName: !Ref Tabela }
      Events:
        Chegou:
          Type: S3
          Properties:
            Bucket: !Ref Bucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: entrada/ }
                  - { Name: suffix, Value: .csv }

Outputs:
  BucketNome:
    Value: !Ref Bucket
  TabelaNome:
    Value: !Ref Tabela
