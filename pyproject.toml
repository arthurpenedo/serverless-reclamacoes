[project]
name = "serverless-reclamacoes"
version = "0.1.0"
description = "Pipeline serverless na AWS (S3 + Lambda + DynamoDB) que resume reclamações de consumidor; testado localmente com moto, dentro do nível gratuito"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["azure-functions", "pytest", "ruff", "moto[s3,dynamodb]>=5"]

[project.scripts]
serverless-reclamacoes = "serverless_reclamacoes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
